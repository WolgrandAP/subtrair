version: '3.8'

services:
  subtrair:
    build:
      context: .
      dockerfile: Dockerfile
    image: calculadora-subtrair:1.0.0
    container_name: calculadora-subtrair
    ports:
      - "3002:3002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3